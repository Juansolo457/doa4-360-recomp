# Dead or Alive 4 (Xbox 360), Redump "Dead or Alive 4 (USA, Europe) (En,Ja,Fr,De,Es,It,Zh,Ko)
# (Rev 1)": default.xex v0.0.0.9, title 544307D1, built 2006-02-14,
# SHA-256 0dba23465e091a03c119a9fb06765ac9cd51e7c14cc22e2130f0c11bf28e7530 (tools/build.ps1 checks it).
# Scaffold as `rexglue init` writes it (ReXGlue v0.10.0.24-dev.gbd833a2). Function hints go below
# in rounds, each with a comment saying where it came from (codegen warnings,
# tools/find_missed_functions.py, tools/check_switch_tables.py, tools/find_vcall_thunks.py).
# Fix missing functions here, never in the generated code.

[project]
name = "doa4"
sdk_version = "0.10.0"
game_root = "assets"

[entrypoint]
file_path = "assets/default.xex"
out_directory_path = "generated/default"
includes = []
# The C runtime's setjmp/longjmp (MS CRT layout: f14-f31 at 0, r1 at 144, r13.. from 152 as std).
# Found 2026-10-29 by matching DOAX2's pair (sub_829F12D0 / sub_829F1080) over 24 instructions with
# immediates and branch targets masked: one hit each. libjpeg's error exit longjmps out of a failed
# decode (DOAX2's photo-album crash); named here, codegen emits ppc_setjmp/ppc_longjmp.
setjmp_address = 0x82A04560
longjmp_address = 0x82A04220

[entrypoint.functions]
# Round 1 (2026-10-29): the first codegen run reported these as `b` targets "not in any
# function". Each starts right after the previous function's last branch, with no .pdata entry;
# checked by disassembly (private/xex/default.bin).
0x8296EAC8 = {}   # zero-extends r4/r5 and compares them (2, 3) before a lookup; tail-called from 0x82977704
0x82450CB0 = {}   # fills a static object at 0x833FEE30 (zeroes, flag 1, two 0x822A88xx pointers); tail-called from 0x82A393A0
0x829CCF50 = {}   # loads 180(r3), returns if null, else jumps through a pointer at 0x82F76658; tail-called from 0x829C6B64

# Round 2 (2026-10-29, second codegen): "Unresolved b target 0x82793F80 from 0x827925E8".
# 0x827925E8 is SwitchToFiber's thunk; 0x82793F80 saves the current fiber's registers (mfcr, LR,
# std r14.. into the context at KTHREAD+0x164) and loads the next one's. The analyser folded it
# into the function before it, as in DOAX2's round 2 (its 0x82785670).
0x82793F80 = {}   # b from 0x827925E8



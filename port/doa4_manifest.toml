# The game's own frame rate and the RenderDoc capture trigger (src/frame_timing.cpp): just before
# its one call to VdSwap (xboxkrnl ordinal 603, thunk 0x82B5E81C), the bl at 0x8275B0BC.
[[entrypoint.midasm_hook]]
name = "Doa4FrameMark"
address = 0x8275B0BC
registers = []

# XAPI's fibers, bound before the first run (DOAX2 crashed 2 s in without them: translated code
# can't switch stacks). Identified 2026-10-29 from the code, the same layout as DOAX2's XAPI and the
# SDK's X_FIBER_CONTEXT: ConvertThreadToFiber fails with 1280 (ERROR_ALREADY_FIBER), allocates
# 2640 (0xA50) bytes and stores them at KTHREAD+0x164 (356); ConvertFiberToThread fails with 1281
# and clears it; CreateFiber allocates the 2640-byte context; DeleteFiber converts back when the
# fiber is the current one, then frees; SwitchToFiber is the thunk to 0x82793F80.
[entrypoint.rexcrt]
ConvertThreadToFiber = 0x827923C0
ConvertFiberToThread = 0x82792450
CreateFiber = 0x827924A0
DeleteFiber = 0x82792588
SwitchToFiber = 0x827925E8

# Switch tables (2026-10-29, tools/check_switch_tables.py after round 2: 826 switches, 7 flagged).
# Two are a code generator bug: the index is loaded as a halfword from a table and sign-extended
# into r11 (lhzx r10; extsh r11,r10; cmplwi r11,N), and the generated switch reads r3, the value
# the table offset was built from earlier. The labels are the image's own table entries.
# The other five are benign, checked by disassembly: in sub_824AF148, sub_824AF790 and
# sub_824AFE60 cases 2 and 6 point at the zero padding word after the function (the console would
# fault there too, so those indices never occur); in sub_822F3178 index 4 branches away before the
# table (cmplwi r31,4; beq); sub_824BF230 has two tables back to back and the checker pairs the
# second with the first's register (the generated code uses the right one for each).
[[entrypoint.switch_tables]]   # in sub_8251D328, table 0x8251D3F8, index r11 (codegen used r3)
address = 0x8251D3F4
register = 11
labels = [0x8251D408, 0x8251D418, 0x8251D428, 0x8251D438]

[[entrypoint.switch_tables]]   # in sub_8251DA10, table 0x8251DC10, index r11 (codegen used r3)
address = 0x8251DC0C
register = 11
labels = [0x8251DC24, 0x8251DC38, 0x8251DC44, 0x8251DC50, 0x8251DC64]
